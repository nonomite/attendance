<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biometrics Attendance</title>
  <style>
    body {background:#f0f0f0;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;}
    .formBox {margin:20px;text-align:center;}
    .cardContainer {display:flex;flex-wrap:wrap;justify-content:flex-start;}
    .card {
      background:white;
      box-shadow:1px 1px 5px rgba(0,0,0,0.2);
      border-radius:6px;
      margin:10px;
      padding:10px;
      width:320px;
    }

    .card h3 {margin:0 0 6px 0;font-size:14px;}
    table {width:100%;border-collapse:collapse;font-size:11px;}
    td,th {border:1px solid #999;padding:3px;text-align:left;}
    @page {size:8.5in 13in landscape;margin:0.7cm;}
    @media print {.formBox{display:none}.card{box-shadow:none;border:1px solid #000}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="formBox">
    <h2>Upload Users & Biometrics CSV</h2>
    <label>Biometrics CSV: <input type="file" id="attendanceFile" accept=".csv"></label><br><br>
    <label>Users CSV: <input type="file" id="namesFile" accept=".csv"></label><br><br>
    <button onclick="processFiles()">Process Records</button>
    <button onclick="window.print()">Print</button>
  </div>
  <div class="cardContainer" id="cards"></div>

<script>
const OFFICIAL_IN = "08:00:00";
const OFFICIAL_OUT = "17:00:00";

function toLocalDateStr(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,"0");
  const d = String(dt.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function parseCsvLine(line) {
  const values = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < line.length; i += 1) {
    const char = line[i];
    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i += 1;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === ',' && !inQuotes) {
      values.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  values.push(current.trim());
  return values;
}

function parseUsersCsv(text) {
  const lines = String(text || "")
    .replace(/\r\n?/g, "\n")
    .split("\n")
    .filter(line => line.trim());

  if (lines.length <= 1) {
    return [];
  }

  return lines.slice(1).map(line => {
    const values = parseCsvLine(line);
    if (!values.length) return null;

    const id = String(values[0] || "").trim();
    const name = values.slice(1).join(",").trim();
    return id && name ? {id, name} : null;
  }).filter(Boolean);
}

function parseBiometricsCsv(text) {
  const lines = String(text || "")
    .replace(/\r\n?/g, "\n")
    .split("\n")
    .filter(line => line.trim());

  if (lines.length <= 1) {
    return [];
  }

  return lines.slice(1).map(line => {
    const values = parseCsvLine(line);
    if (values.length < 3) return null;

    const id = String(values[0] || "").trim();
    const datetime = String(values[values.length - 2] || "").trim();
    const status = String(values[values.length - 1] || "").trim().toLowerCase();

    return id && datetime ? {id, datetime, status} : null;
  }).filter(Boolean);
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Unable to read the selected file."));
    reader.readAsText(file, "utf-8");
  });
}

function parseDateTimeValue(value) {
  if (!value) return null;
  if (value instanceof Date) return isNaN(value) ? null : value;

  const text = String(value).trim();
  const candidates = [text];
  if (text.includes(" ")) {
    candidates.push(text.replace(/ /, "T"));
  }
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(text)) {
    candidates.push(text.replace(/ /, "T"));
  }

  for (const candidate of candidates) {
    const dt = new Date(candidate);
    if (!isNaN(dt)) return dt;
  }

  return null;
}

function computeMinutesLate(actualDateTime, expectedTime) {
  const actual = parseDateTimeValue(actualDateTime);
  if (!actual) return null;
  const datePart = toLocalDateStr(actual);
  const expected = new Date(`${datePart}T${expectedTime}`);
  if (actual > expected) {
    return Math.round((actual - expected)/60000);
  }
  return 0;
}

async function processFiles() {
  const attFile = document.getElementById("attendanceFile").files[0];
  const namesFile = document.getElementById("namesFile").files[0];

  if (!attFile || !namesFile) {
    alert("Please upload both Biometrics and Users CSV.");
    return;
  }

  try {
    const [usersText, attText] = await Promise.all([
      readFileAsText(namesFile),
      readFileAsText(attFile)
    ]);

    const users = parseUsersCsv(usersText)
      .filter(user => user.id && user.name);

    if (users.length === 0) {
      alert('No users found. Make sure the Users CSV has an id and name column.');
      return;
    }

    const data = parseBiometricsCsv(attText)
      .filter(r => r.id && r.datetime);

    const byId = {};
    data.forEach(r => {
      const dt = parseDateTimeValue(r.datetime);
      if (!dt) return;

      if (!byId[r.id]) {
        byId[r.id] = {};
      }
      const date = toLocalDateStr(dt);
      if (!byId[r.id][date]) byId[r.id][date] = [];
      byId[r.id][date].push({dt,status:r.status});
    });

    const matchedIds = new Set(users.map(user => user.id));
    const unmatchedData = Object.keys(byId)
      .filter(id => !matchedIds.has(id))
      .map(id => ({
        id,
        name: `Unmatched ${id}`,
        days: Object.keys(byId[id]).sort().map(date => {
          const records = byId[id][date].sort((a,b)=>a.dt-b.dt);
          const timeIn = records[0]?.dt.toTimeString().split(" ")[0] || null;
          const timeOut = records[records.length-1]?.dt.toTimeString().split(" ")[0] || null;
          const minutesLate = timeIn ? computeMinutesLate(`${date}T${timeIn}`, OFFICIAL_IN) : null;
          return {date,timeIn,timeOut,minutesLate};
        })
      }));

    const processed = [
      ...users.map(user => {
        const dayGroups = byId[user.id] || {};
        const days = Object.keys(dayGroups).sort().map(date => {
          const records = dayGroups[date].sort((a,b)=>a.dt-b.dt);
          const timeIn = records[0]?.dt.toTimeString().split(" ")[0] || null;
          const timeOut = records[records.length-1]?.dt.toTimeString().split(" ")[0] || null;
          const minutesLate = timeIn ? computeMinutesLate(`${date}T${timeIn}`, OFFICIAL_IN) : null;
          return {date,timeIn,timeOut,minutesLate};
        });

        return {
          id: user.id,
          name: user.name,
          days: days.length ? days : [{date:"(no records)",timeIn:null,timeOut:null,minutesLate:null}]
        };
      }),
      ...unmatchedData
    ];

    renderCards(processed);
  } catch (err) {
    alert("Failed to read the uploaded CSV files: " + err.message);
  }
}

function renderCards(users) {
  const container=document.getElementById("cards");
  container.innerHTML="";
  users.forEach(user => {
    let html=`<div class="card"><h3>${user.name} (${user.id})</h3><table><tr><th>Date</th><th>In</th><th>Out</th><th>Late(min)</th></tr>`;
    user.days.forEach(d => {
      html+=`<tr><td>${d.date}</td><td>${d.timeIn||"-"}</td><td>${d.timeOut||"-"}</td><td>${d.minutesLate!==null?d.minutesLate:"-"}</td></tr>`;
    });
    html+="</table></div>";
    container.innerHTML+=html;
  });
}
</script>
</body>
</html>
