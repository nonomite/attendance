<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biometrics Records</title>
  <style>
    body {
      background-color:#f0f0f0;
      font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
    }
    .formBox {
      margin:20px;
      text-align:center;
    }
    .cardContainer {
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-start;
      page-break-inside: avoid;
    }
    .card {
      background-color:white;
      box-shadow:1px 1px 5px rgba(0,0,0,0.2);
      border-radius:6px;
      margin:8px;
      padding:10px;
      width:280px; /* narrower cards for thinner tables */
      page-break-inside: avoid;
    }
    .card h3 {
      margin:0 0 6px 0;
      font-size:14px;
    }
    table {
      width:100%;
      border-collapse:collapse;
      font-size:11px; /* smaller font for thinner layout */
    }
    td,th {
      border:1px solid #999;
      padding:3px; /* reduced padding */
      text-align:left;
    }

    /* Print settings */
    @page {
      size: 8.5in 13in landscape;
      margin: 0.7cm;
    }
    @media print {
      body {background-color:white;}
      .formBox {display:none;} /* hide upload form when printing */
      .cardContainer {justify-content:flex-start;}
      .card {box-shadow:none;border:1px solid #000;}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="formBox">
    <h2>Upload Biometrics CSV</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button onclick="processCSV()">Show Records</button>
    <button onclick="window.print()">Print</button>
  </div>

  <div class="cardContainer" id="cards"></div>

<script>
function processCSV() {
  const file = document.getElementById("csvFile").files[0];
  if (!file) {
    alert("Please upload a CSV file.");
    return;
  }

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const data = results.data.map(row => ({
        name: row["name"]?.trim(),
        datetime: row["date/time"],
        status: row["status"]
      }));

      // Group by name
      const grouped = {};
      data.forEach(row => {
        if (!grouped[row.name]) grouped[row.name] = [];
        grouped[row.name].push({datetime: row.datetime, status: row.status});
      });

      renderCards(grouped);
    }
  });
}

function renderCards(grouped) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  Object.entries(grouped).forEach(([name, records]) => {
    let html = `<div class="card"><h3>${name}</h3><table><tr><th>Date/Time</th><th>Status</th></tr>`;
    records.forEach(r => {
      html += `<tr><td>${r.datetime}</td><td>${r.status}</td></tr>`;
    });
    html += "</table></div>";
    container.innerHTML += html;
  });
}
</script>
</body>
</html>
